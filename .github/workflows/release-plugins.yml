name: Release plugin archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Package and inspect pstack
        run: python3 scripts/package-plugin.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: main-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<EOF
          pstack plugin archive from commit ${GITHUB_SHA}.

          Download pstack.tar.gz for plugin import, rather than GitHub's automatic source-code archives.
          The archive contains plugin.json at its root, all bundled skills, references, and licenses.
          SHA-256 checksum: pstack.tar.gz.sha256.

          Packaging checks passed. Installation and skill runtime behavior are not tested by this workflow.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/pstack.tar.gz dist/pstack.tar.gz.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" dist/pstack.tar.gz dist/pstack.tar.gz.sha256 \
              --target "$GITHUB_SHA" \
              --title "pstack — main build ${GITHUB_RUN_NUMBER}" \
              --notes-file dist/release-notes.md
          fi
